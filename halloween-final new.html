<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🎃ハロウィン トリック・オア・トリート</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#2a1a4a 0%,#4a2a6a 50%,#2a1a4a 100%);font-family:system-ui,sans-serif}
#container{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;padding-top:20px}
canvas{display:block;border:6px solid #ff8800;border-radius:20px;box-shadow:0 0 40px rgba(255,136,0,0.8);background:#000;margin-top:20px}
#gameUI{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:100}
#resultPanel{display:none;position:fixed;bottom:0;left:0;right:0;top:0;background:rgba(0,0,0,0.95);z-index:150;padding:20px;overflow-y:auto;flex-direction:column}
#resultContent{color:#fff;text-align:center;flex:1}
#resultButtons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:20px;padding-top:20px;border-top:2px solid #666}
button{background:linear-gradient(135deg,#ff8800,#ff6600);color:#000;border:2px solid #ffaa00;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:bold;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 8px rgba(0,0,0,0.4)}
button:hover{transform:scale(1.1);box-shadow:0 6px 12px rgba(0,0,0,0.6)}
button:active{transform:scale(0.95)}
.small-btn{padding:6px 10px;font-size:10px}
.status{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#ffff00;font-weight:bold;font-size:14px;text-shadow:2px 2px #000;z-index:50;text-align:center}
#lifeBar{position:absolute;top:10px;right:10px;font-size:24px;z-index:50;letter-spacing:4px}
#countdown{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:100px;font-weight:bold;color:#ffff00;text-shadow:3px 3px #000,6px 6px rgba(0,0,0,0.5);z-index:200;display:none}
h2{color:#ffff00;font-size:24px;margin:10px 0}
.rank-list{color:#fff;text-align:left;max-width:300px;margin:10px auto;padding:10px;background:rgba(100,50,100,0.3);border-radius:8px;max-height:150px;overflow-y:auto;font-size:11px}
.rank-item{padding:5px;border-bottom:1px solid #555}
.rank-section{margin:10px 0;padding:10px;background:rgba(100,80,120,0.2);border-radius:8px}
.rank-title{color:#ffdd44;font-weight:bold;font-size:12px;margin-bottom:5px}
#nameInput{width:80%;max-width:200px;padding:8px;border:2px solid #ffaa00;border-radius:8px;background:#333;color:#fff;font-size:12px;margin:10px auto}
@media(orientation:landscape){
#container{width:100%;height:100%;flex-direction:row;justify-content:center;padding-top:0;padding:0}
canvas{width:100%;height:100%;margin-top:0;max-width:none;max-height:none}
#gameUI{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);flex-direction:row;gap:8px}
button{padding:8px 12px;font-size:11px}
}
</style>
</head>
<body>
<div id="container">
<div class="status">
<div id="score">スコア: 0 | 残り: 15秒</div>
<div id="combo">Trick or Treat</div>
</div>
<div id="lifeBar">💚💚💚</div>
<canvas id="c"></canvas>
<div id="countdown"></div>
<div id="gameUI">
<button id="startBtn">🎮 START</button>
<button id="sndBtn" class="small-btn">🔊</button>
<button id="fullscreenBtn" class="small-btn">⛶</button>
</div>
<div id="resultPanel">
<div id="resultContent">
<h2>🎃 GAME OVER 🎃</h2>
<div style="color:#ffff00;font-size:28px;margin:15px 0">スコア: <span id="finalScore">0</span></div>
<div style="color:#ffdd44;font-size:14px;margin:10px 0">ライフ残数: <span id="finalLife">0</span></div>
<input type="text" id="nameInput" placeholder="プレイヤー名を入力">
<button id="registerBtn" style="margin:10px auto;display:block">🏆 ランキングに登録</button>
<div id="resultRank"></div>
</div>
<div id="resultButtons">
<button id="retryBtn">🎮 もう一度</button>
<button id="resultSndBtn" class="small-btn">🔊</button>
</div>
</div>
</div>

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,SCALE;

function resizeCanvas(){
  if(window.innerWidth>window.innerHeight){
    W=Math.min(window.innerHeight*1.2,window.innerWidth*0.65);
    H=Math.min(window.innerHeight*0.9,window.innerWidth/1.2*0.65);
  }else{
    W=Math.min(window.innerWidth*0.95,700);
    H=Math.min(window.innerHeight*0.75,1000);
  }
  cv.width=W;
  cv.height=H;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

function beep(f,d){
  if(!snd)return;try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f;g.gain.value=0.1;g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}

function drawPumpkin(x,y,r){
  ctx.save();ctx.translate(x,y);ctx.shadowColor='rgba(255,153,0,0.5)';ctx.shadowBlur=20;
  ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  for(let i=0;i<8;i++){
    const a=i*Math.PI*2/8;const px=Math.cos(a)*r*0.7,py=Math.sin(a)*r*0.7;
    ctx.fillStyle='#ff7700';ctx.beginPath();ctx.ellipse(px,py,r*0.3,r*0.5,a,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-r*0.3,-r*0.2,r*0.15,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.3,-r*0.2,r*0.15,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff3300';ctx.beginPath();ctx.moveTo(-r*0.2,r*0.1);ctx.quadraticCurveTo(0,r*0.3,r*0.2,r*0.1);
  ctx.lineTo(r*0.2,r*0.15);ctx.quadraticCurveTo(0,r*0.25,-r*0.2,r*0.15);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawGhost(x,y,r){
  ctx.save();ctx.translate(x,y);ctx.shadowColor='rgba(100,150,255,0.5)';ctx.shadowBlur=15;
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.ellipse(0,0,r,r*1.1,0,0,Math.PI*2);ctx.fill();
  for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(i*r*0.4,r*0.9,r*0.35,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#3366ff';ctx.beginPath();ctx.arc(-r*0.3,-r*0.2,r*0.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.3,-r*0.2,r*0.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-r*0.3,-r*0.2,r*0.08,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.3,-r*0.2,r*0.08,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff4444';ctx.fillRect(-r*0.15,r*0.1,r*0.3,r*0.15);ctx.restore();
}
function drawMaple(x,y,r){
  ctx.save();ctx.translate(x,y);ctx.shadowColor='rgba(255,50,50,0.5)';ctx.shadowBlur=15;
  ctx.fillStyle='#ff4444';ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=(i*Math.PI*2/5)-Math.PI/2;const px=Math.cos(a)*r*0.8,py=Math.sin(a)*r*0.8;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    const a2=a+Math.PI*2/10;
    ctx.quadraticCurveTo(Math.cos(a2)*r*0.3,Math.sin(a2)*r*0.3,Math.cos(a+Math.PI*2/5)*r*0.8,Math.sin(a+Math.PI*2/5)*r*0.8);
  }
  ctx.closePath();ctx.fill();ctx.fillStyle='#cc0000';ctx.beginPath();ctx.arc(0,0,r*0.3,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawZombie(x,y,r){
  ctx.save();ctx.translate(x,y);ctx.shadowColor='rgba(255,0,0,0.5)';ctx.shadowBlur=15;
  ctx.fillStyle='#666666';ctx.beginPath();ctx.ellipse(0,0,r*0.8,r*0.9,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffcccc';ctx.beginPath();ctx.ellipse(-r*0.25,-r*0.25,r*0.25,r*0.35,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(r*0.25,-r*0.25,r*0.25,r*0.35,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff0000';ctx.beginPath();ctx.arc(-r*0.25,-r*0.25,r*0.1,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.25,-r*0.25,r*0.1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.fillRect(-r*0.2,r*0.2,r*0.4,r*0.3);ctx.restore();
}

function start(){countdown=3;mode='countdown';beep(440,0.1);}

function startGame(){
  score=0;life=3;time=15;fever=0;feverMsg='';items=[];fx=[];parts=[];spawnT=0;ci=0;si=0;mode='play';countdown=0;
  document.getElementById('gameUI').style.display='flex';
  document.getElementById('resultPanel').style.display='none';
}

function end(){
  mode='over';beep(220,0.3);
  showResult();
}

function showResult(){
  document.getElementById('gameUI').style.display='none';
  document.getElementById('resultPanel').style.display='flex';
  document.getElementById('finalScore').textContent=score;
  document.getElementById('finalLife').textContent=life;
  document.getElementById('nameInput').value='';
  
  const ranks=JSON.parse(localStorage.getItem('halo_ranks')||'{}');
  let rankHtml='<h3 style="color:#ffff00;font-size:16px;margin-top:20px">🏆 ランキング 🏆</h3>';
  
  for(let l=3;l>=0;l--){
    const lifeRanks=[];
    for(let name in ranks){
      if(ranks[name].life===l)lifeRanks.push({name,score:ranks[name].score});
    }
    lifeRanks.sort((a,b)=>b.score-a.score);
    if(lifeRanks.length>0){
      rankHtml+='<div class="rank-section"><div class="rank-title">ライフ'+l+'</div><div class="rank-list">';
      rankHtml+=lifeRanks.slice(0,5).map((x,i)=>`<div class="rank-item">${i+1}位: ${x.name} ${x.score}点</div>`).join('');
      rankHtml+='</div></div>';
    }
  }
  
  document.getElementById('resultRank').innerHTML=rankHtml;
}

function spawn(){
  const free=holes.map((_,i)=>i).filter(i=>!items.some(it=>it.h===i));
  if(!free.length)return;
  const h=free[Math.random()*free.length|0];
  const r=Math.random();
  let t=r<0.07?'zombie':r<0.5?'pumpkin':r<0.75?'maple':'ghost';
  items.push({h,t,age:0,life:t==='zombie'?600:800});
}

function tap(cx,cy){
  const b=cv.getBoundingClientRect(),x=(cx-b.left)/b.width*W,y=(cy-b.top)/b.height*H;
  if(mode==='countdown')return;
  if(mode!=='play'){if(mode==='over')mode='title';else start();return;}
  for(let i=items.length-1;i>=0;i--){
    const it=items[i],h=holes[it.h];
    const hx=h.x*W,hy=h.y*H;
    if(Math.hypot(x-hx,y-hy)<H*0.12){
      pressed[it.h]=1;
      items.splice(i,1);
      if(it.t==='zombie'){life--;if(life<=0)end();beep(440,0.2);return;}
      let p=(it.t==='pumpkin'?50:it.t==='maple'?200:-100)*(fever?2:1);
      score=Math.max(0,score+p);
      fx.push({x:hx,y:hy,l:1,t:p>0?'+'+p:p,c:p>0?'#ffff00':'#ff4444',sz:20});
      for(let j=0;j<16;j++){
        const a=Math.random()*Math.PI*2,s=2+Math.random()*2;
        const colors=['#ff00ff','#00ffff','#ffff00','#ff6600'];
        parts.push({x:hx,y:hy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,l:1,c:colors[Math.random()*4|0]});
      }
      beep(p>0?700:200,0.1);
      
      let comboTriggered=false;
      if(it.t===combo.s[ci]){ci++;}else ci=it.t===combo.s[0]?1:0;
      if(ci>=combo.s.length){
        ci=0;fever=6;feverMsg='trick or treat!';comboTriggered=true;
        fx.push({x:W/2,y:H/3,l:1.6,t:'trick or treat!',c:'#ffff00',sz:32});
        beep(1200,0.3);
        for(let j=0;j<30;j++){
          const a=Math.random()*Math.PI*2,s=3+Math.random()*2;
          parts.push({x:W/2,y:H/3,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1.5,c:'#ffff00'});
        }
      }
      
      if(!comboTriggered){
        if(it.t===secret.s[si]){si++;}else si=it.t===secret.s[0]?1:0;
        if(si>=secret.s.length){
          si=0;fever=8;feverMsg='FEVER TIME!';
          score+=secret.pt;
          fx.push({x:W/2,y:H/3,l:1.6,t:'FEVER TIME! +500',c:'#ff00ff',sz:32});
          beep(1500,0.4);
          for(let j=0;j<40;j++){
            const a=Math.random()*Math.PI*2,s=4+Math.random()*2;
            parts.push({x:W/2,y:H/3,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1.5,c:'#ff00ff'});
          }
        }
      }
      setTimeout(()=>delete pressed[it.h],150);
      return;
    }
  }
}

cv.addEventListener('click',e=>tap(e.clientX,e.clientY));
cv.addEventListener('touchstart',e=>{e.preventDefault();tap(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});

function update(dt){
  if(mode==='countdown'){countdown-=dt;if(countdown<=0)startGame();return;}
  if(mode!=='play')return;
  time-=dt;if(fever>0)fever-=dt;
  if(time<=0){time=0;end();return;}
  spawnT-=dt*1000;
  if(spawnT<=0){spawn();spawnT=500*(fever?0.6:1)*(0.7+Math.random()*0.6);}
  items.forEach(i=>i.age+=dt*1000);items=items.filter(i=>i.age<i.life);
  fx.forEach(f=>{f.y-=50*dt;f.l-=dt*1.8;});fx=fx.filter(f=>f.l>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.l-=dt*1.2;});parts=parts.filter(p=>p.l>0);
}

function draw(ts){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(bgImg.complete&&bgImg.naturalWidth){
    ctx.globalAlpha=0.7;
    const scale=Math.max(W/bgImg.width,H/bgImg.height);
    ctx.drawImage(bgImg,(W-bgImg.width*scale)/2,(H-bgImg.height*scale)/2,bgImg.width*scale,bgImg.height*scale);
    ctx.globalAlpha=1;
  }
  ctx.fillStyle='rgba(50,20,80,0.7)';ctx.fillRect(0,0,W,H);
  
  ctx.fillStyle='rgba(255,200,0,0.1)';
  for(let i=0;i<5;i++){
    const y=H/5+i*H/5;
    ctx.beginPath();ctx.arc(W*0.1,y,H*0.08,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(W*0.9,y,H*0.08,0,Math.PI*2);ctx.fill();
  }

  ctx.fillStyle='rgba(100,80,120,0.3)';
  ctx.beginPath();
  ctx.moveTo(W*0.05,H*0.15);ctx.quadraticCurveTo(W*0.05,H*0.2,W*0.1,H*0.2);
  ctx.lineTo(W*0.4,H*0.2);ctx.quadraticCurveTo(W*0.5,H*0.15,W*0.6,H*0.2);
  ctx.lineTo(W*0.9,H*0.2);ctx.quadraticCurveTo(W*0.95,H*0.2,W*0.95,H*0.15);
  ctx.bezierCurveTo(W*0.95,H*0.25,W*0.95,H*0.55,W*0.95,H*0.65);
  ctx.quadraticCurveTo(W*0.95,H*0.7,W*0.9,H*0.7);
  ctx.lineTo(W*0.6,H*0.7);ctx.quadraticCurveTo(W*0.5,H*0.75,W*0.4,H*0.7);
  ctx.lineTo(W*0.1,H*0.7);ctx.quadraticCurveTo(W*0.05,H*0.7,W*0.05,H*0.65);
  ctx.bezierCurveTo(W*0.05,H*0.55,W*0.05,H*0.25,W*0.05,H*0.15);
  ctx.closePath();ctx.fill();

  ctx.strokeStyle='#ffaa00';ctx.lineWidth=6;ctx.beginPath();
  ctx.moveTo(W*0.05,H*0.15);ctx.quadraticCurveTo(W*0.05,H*0.2,W*0.1,H*0.2);
  ctx.lineTo(W*0.4,H*0.2);ctx.quadraticCurveTo(W*0.5,H*0.15,W*0.6,H*0.2);
  ctx.lineTo(W*0.9,H*0.2);ctx.quadraticCurveTo(W*0.95,H*0.2,W*0.95,H*0.15);
  ctx.bezierCurveTo(W*0.95,H*0.25,W*0.95,H*0.55,W*0.95,H*0.65);
  ctx.quadraticCurveTo(W*0.95,H*0.7,W*0.9,H*0.7);
  ctx.lineTo(W*0.6,H*0.7);ctx.quadraticCurveTo(W*0.5,H*0.75,W*0.4,H*0.7);
  ctx.lineTo(W*0.1,H*0.7);ctx.quadraticCurveTo(W*0.05,H*0.7,W*0.05,H*0.65);
  ctx.bezierCurveTo(W*0.05,H*0.55,W*0.05,H*0.25,W*0.05,H*0.15);
  ctx.closePath();ctx.stroke();

  holes.forEach((h,i)=>{
    const hx=h.x*W,hy=h.y*H;const pr=pressed[i]||0;
    ctx.fillStyle='rgba(80,60,100,0.6)';ctx.beginPath();ctx.arc(hx,hy,H*0.1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#0a0510';ctx.beginPath();ctx.arc(hx,hy,H*0.08-pr*H*0.02,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(hx-H*0.02,hy-H*0.02,H*0.06,0,Math.PI*2);ctx.stroke();
  });

  items.forEach(it=>{
    const h=holes[it.h],hx=h.x*W,hy=h.y*H;
    const pop=Math.min(1,it.age/120),left=1-it.age/it.life;
    const s=pop*(left<0.15?left/0.15:1);
    const y=hy+(1-s)*H*0.08;
    const r=H*0.09*(0.3+0.7*s);
    if(it.t==='pumpkin')drawPumpkin(hx,y,r);
    else if(it.t==='ghost')drawGhost(hx,y,r);
    else if(it.t==='maple')drawMaple(hx,y,r);
    else drawZombie(hx,y,r);
  });

  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,H*0.015+p.l,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;

  fx.forEach(f=>{
    ctx.globalAlpha=Math.min(1,f.l);ctx.fillStyle=f.c;
    ctx.font='bold '+f.sz+'px system-ui';ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=8;
    ctx.fillText(f.t,f.x,f.y);
  });
  ctx.globalAlpha=1;ctx.shadowColor='transparent';

  document.getElementById('score').textContent=`スコア: ${score} | 残り: ${Math.ceil(time)}秒`;
  let lifeDisplay='';
  for(let i=0;i<life;i++)lifeDisplay+='💚';
  for(let i=life;i<3;i++)lifeDisplay+='🩶';
  document.getElementById('lifeBar').textContent=lifeDisplay;
  let comboText=combo.n+' ['+ci+'/'+combo.s.length+']';
  if(fever>0)comboText=(feverMsg?feverMsg:'FEVER!')+' ['+Math.ceil(fever*10)/10+'s]';
  document.getElementById('combo').textContent=comboText;

  if(mode==='countdown'){
    const n=Math.ceil(countdown);
    const countdownEl=document.getElementById('countdown');
    countdownEl.textContent=n;countdownEl.style.display='block';
    countdownEl.style.fontSize=(100*n/3)+'px';
  }else{
    document.getElementById('countdown').style.display='none';
  }

  if(mode!=='play'){
    ctx.fillStyle='rgba(0,0,0,0.9)';ctx.fillRect(0,0,W,H);
    if(mode==='title'){
      ctx.fillStyle='#ffff00';
      ctx.font='bold '+Math.floor(W/10)+'px serif';ctx.textAlign='center';
      ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=10;
      ctx.fillText('🎃HALLOWEEN🎃',W/2,H*0.2);
      ctx.fillStyle='#fff';ctx.font=Math.floor(W/15)+'px system-ui';ctx.fillText('TRICK OR TREAT',W/2,H*0.3);
      drawPumpkin(W*0.2,H*0.45,H*0.08);drawMaple(W*0.5,H*0.45,H*0.08);drawGhost(W*0.8,H*0.45,H*0.08);
      ctx.fillStyle='#ffff00';ctx.font=Math.floor(W/25)+'px system-ui';ctx.fillText('🎃+50 | 🍁+200 | 👻-100 | 🧟-1ライフ',W/2,H*0.58);
      ctx.fillStyle='#ffaa00';ctx.font='bold '+Math.floor(W/20)+'px system-ui';
      ctx.fillText('▶ TAP TO START ◀',W/2,H*0.75);
    }
    ctx.shadowColor='transparent';
  }
}

function loop(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  update(dt);draw(ts);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.getElementById('startBtn').onclick=()=>start();
document.getElementById('sndBtn').onclick=function(){
  snd=!snd;localStorage.setItem('halo_snd',snd);
  this.textContent=snd?'🔊':'🔇';
};
document.getElementById('fullscreenBtn').onclick=function(){
  const elem=document.querySelector('#container');
  if(!elem)return;
  try{
    if(elem.webkitEnterFullscreen){
      elem.webkitEnterFullscreen();
    }else if(elem.webkitRequestFullscreen){
      elem.webkitRequestFullscreen();
    }else if(elem.requestFullscreen){
      elem.requestFullscreen().catch(e=>{console.log('Fullscreen failed',e);});
    }else if(elem.mozRequestFullScreen){
      elem.mozRequestFullScreen();
    }else{
      console.log('Fullscreen not supported');
    }
  }catch(e){
    console.log('Error:',e);
  }
};
document.getElementById('retryBtn').onclick=()=>{startGame();};
document.getElementById('resultSndBtn').onclick=function(){
  snd=!snd;localStorage.setItem('halo_snd',snd);
  this.textContent=snd?'🔊':'🔇';
};
document.getElementById('registerBtn').onclick=function(){
  const name=document.getElementById('nameInput').value.trim();
  if(!name){alert('プレイヤー名を入力してください');return;}
  
  const ranks=JSON.parse(localStorage.getItem('halo_ranks')||'{}');
  
  // 同じ名前がある場合、良い方のスコアを採用
  if(ranks[name]){
    if(score>ranks[name].score){
      ranks[name]={score:score,life:life};
    }
  }else{
    ranks[name]={score:score,life:life};
  }
  
  localStorage.setItem('halo_ranks',JSON.stringify(ranks));
  alert('「'+name+'」さんでランキングに登録しました！');
  showResult();
};

document.getElementById('sndBtn').textContent=snd?'🔊':'🔇';
document.getElementById('resultSndBtn').textContent=snd?'🔊':'🔇';

</script>
